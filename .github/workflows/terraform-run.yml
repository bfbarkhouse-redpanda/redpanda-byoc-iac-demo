# Reusable job: init -> plan -> (optionally) apply against one environment.
# With destroy: true it plans and applies a destroy instead.
name: terraform-run

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      apply:
        type: boolean
        default: false
      destroy:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS for S3 state

jobs:
  terraform:
    name: ${{ inputs.destroy && 'destroy' || (inputs.apply && 'apply' || 'plan') }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Binds the job to the GitHub Environment: scopes secrets and enforces
    # protection rules (required reviewers on prod).
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      REDPANDA_CLIENT_ID: ${{ secrets.REDPANDA_CLIENT_ID }}
      REDPANDA_CLIENT_SECRET: ${{ secrets.REDPANDA_CLIENT_SECRET }}
      TF_VAR_app_user_password: ${{ secrets.APP_USER_PASSWORD }}
      TF_VAR_cluster_id: ${{ vars.REDPANDA_CLUSTER_ID }} # environment-scoped variable
      VAR_FILE: envs/${{ inputs.environment }}.tfvars
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Init
        run: >-
          terraform init
          -backend-config=envs/${{ inputs.environment }}.s3.tfbackend
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # The provider reads allow_deletion from state at destroy time. Flip it to
      # true directly in state: applying the config instead would also apply any
      # other pending changes (e.g. a rename forcing replacement), which fails
      # on protected resources. Destroy then removes exactly what is in state.
      - name: Lift deletion protection
        if: inputs.destroy
        run: |
          terraform state pull > state.json
          jq '(.resources[]
                | select(.mode == "managed" and (.type | test("^redpanda_(topic|user|role|acl)$")))
                | .instances[].attributes.allow_deletion) |= true
              | .serial += 1' state.json > lifted.json
          if [ "$(jq -S 'del(.serial)' state.json)" = "$(jq -S 'del(.serial)' lifted.json)" ]; then
            echo "No protected resources in state."
          else
            terraform state push lifted.json
            jq -r '.resources[] | select(.mode == "managed") | .type + "." + .name + ": allow_deletion=" + ([.instances[].attributes.allow_deletion] | map(tostring) | join(","))' lifted.json
          fi
          rm -f state.json lifted.json

      - name: Plan
        run: terraform plan -var-file="$VAR_FILE" -out=tfplan ${{ inputs.destroy && '-destroy' || '' }}

      - name: Plan summary
        run: |
          {
            echo "### Terraform ${{ inputs.destroy && 'destroy ' || '' }}plan: \`${{ inputs.environment }}\`"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.apply || inputs.destroy
        run: terraform apply tfplan
