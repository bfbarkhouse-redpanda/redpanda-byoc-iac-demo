# Reusable job: init -> plan -> (optionally) apply against one environment.
name: terraform-run

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      apply:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS for S3 state

jobs:
  terraform:
    name: ${{ inputs.apply && 'apply' || 'plan' }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Binds the job to the GitHub Environment: scopes secrets and enforces
    # protection rules (required reviewers on prod).
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      REDPANDA_CLIENT_ID: ${{ secrets.REDPANDA_CLIENT_ID }}
      REDPANDA_CLIENT_SECRET: ${{ secrets.REDPANDA_CLIENT_SECRET }}
      TF_VAR_app_user_password: ${{ secrets.APP_USER_PASSWORD }}
      TF_VAR_cluster_id: ${{ vars.REDPANDA_CLUSTER_ID }} # environment-scoped variable
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Init
        run: >-
          terraform init
          -backend-config=envs/${{ inputs.environment }}.s3.tfbackend
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        run: terraform plan -var-file=envs/${{ inputs.environment }}.tfvars -out=tfplan

      - name: Plan summary
        run: |
          {
            echo "### Terraform plan: \`${{ inputs.environment }}\`"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.apply
        run: terraform apply tfplan
